services:
  postgres:
    image: postgres:17-alpine
    container_name: car_import_db
    environment:
      POSTGRES_DB: car_import
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      # українська локаль ICU: коректні lower()/ILIKE і сортування кирилиці
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=uk-UA --locale=C.UTF-8"
      TZ: Europe/Kyiv
      PGTZ: Europe/Kyiv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
      - ./demo:/demo:ro
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_import"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - db_network

  # Необов'язковий графічний клієнт: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: car_import_pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - db_network

volumes:
  postgres_data:

networks:
  db_network:
    driver: bridge
